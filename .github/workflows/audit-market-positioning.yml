name: Audit market positioning

on:
  push:
    paths:
      - '.github/workflows/audit-market-positioning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find market-specific wording
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Market-specific references ==='
          grep -RInE --exclude-dir=.git --exclude='*.jpg' --exclude='*.png' --exclude='*.webp' --exclude='*.woff*' '(US &amp; UK|US & UK|US and UK|US, UK|United States|United Kingdom|US accounting|UK accountancy|US CPA|UK chartered|US firms|UK firms)' . || true
