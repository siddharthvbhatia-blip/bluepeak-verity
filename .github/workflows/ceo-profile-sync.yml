name: Sync CEO profile title

on:
  push:
    paths:
      - '.github/workflows/ceo-profile-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Align CEO title across source pages
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): [
                  ('assets/script.js?v=20260817-commercial-1', 'assets/script.js?v=20260912-ceo-r1'),
                  ('"jobTitle":"Chartered Accountant (India)"', '"jobTitle":"Chief Executive Officer | Chartered Accountant (India)"'),
                  ('alt="CA Siddharth Bhatia, founder of BluePeak Verity"', 'alt="CA Siddharth Bhatia, CEO of BluePeak Verity"'),
                  ('<p class="eyebrow">Founder</p>\n          <h2>CA Siddharth Bhatia</h2>', '<p class="eyebrow">CEO</p>\n          <h2>CA Siddharth Bhatia</h2>'),
              ],
              Path('about.html'): [
                  ('assets/script.js?v=20260807-founder-xero-r2', 'assets/script.js?v=20260912-ceo-r1'),
                  ('alt="CA Siddharth Bhatia, founder of BluePeak Verity"', 'alt="CA Siddharth Bhatia, CEO of BluePeak Verity"'),
                  ('<p class="eyebrow">Founder</p><h2>CA Siddharth Bhatia</h2>', '<p class="eyebrow">CEO</p><h2>CA Siddharth Bhatia</h2>'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Verify CEO source labels
        run: |
          grep -q 'assets/script.js?v=20260912-ceo-r1' index.html
          grep -q 'assets/script.js?v=20260912-ceo-r1' about.html
          grep -q 'Chief Executive Officer | Chartered Accountant (India)' index.html
          grep -q 'CEO of BluePeak Verity' index.html
          grep -q 'CEO of BluePeak Verity' about.html
      - name: Commit source alignment
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html
          git commit -m 'Align Siddharth profile title to CEO'
          git push
