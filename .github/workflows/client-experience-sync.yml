name: Sync client experience asset version

on:
  push:
    paths:
      - '.github/workflows/client-experience-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate enhancement JavaScript
        run: node --check assets/client-experience-upgrade.js
      - name: Cache-bust homepage loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/script.js?v=20260912-ceo-r1'
          new = 'assets/script.js?v=20260914-client-experience-r1'
          if old not in text and new not in text:
              raise SystemExit('Expected script loader reference not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify homepage loader
        run: grep -q 'assets/script.js?v=20260914-client-experience-r1' index.html
      - name: Commit cache sync
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Activate client experience upgrade on homepage'
          git push
