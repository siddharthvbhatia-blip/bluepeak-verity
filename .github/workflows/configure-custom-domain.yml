name: Configure BluePeak custom domain

on:
  push:
    paths:
      - '.github/workflows/configure-custom-domain.yml'

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/${{ github.repository }}/pages \
            -f cname='bluepeakverity.com' \
            -f build_type='workflow'

      - name: Show Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/${{ github.repository }}/pages
