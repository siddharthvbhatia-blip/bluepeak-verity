name: Deploy BluePeak Verity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check assets/script.js

      - name: Validate required site files
        run: |
          set -euo pipefail
          for file in index.html about.html xero-certified.html privacy.html terms.html 404.html robots.txt sitemap.xml assets/styles.css assets/script.js assets/logo.svg assets/favicon.svg assets/og-card.svg assets/founder-original-attached.jpg; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          ! grep -R "github.io/itrdesk/bluepeak-verity" --include='*.html' --include='*.xml' --include='*.txt' .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
