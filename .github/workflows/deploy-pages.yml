name: Deploy BluePeak Verity to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check assets/script.js

      - name: Validate required site files
        run: |
          set -euo pipefail
          for file in index.html about.html xero-certified.html privacy.html terms.html 404.html robots.txt sitemap.xml assets/styles.css assets/script.js assets/logo.svg assets/favicon.svg assets/og-card.svg assets/founder-original-attached.jpg 1bccfdc0f1b230fd5f58cedc65708b5b.txt; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          ! grep -R "github.io/itrdesk/bluepeak-verity" --include='*.html' --include='*.xml' --include='*.txt' .
          ! grep -R "siddharthvbhatia-blip.github.io/bluepeak-verity" --include='*.html' --include='*.xml' --include='*.txt' .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom-domain endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://bluepeakverity.com/" \
            "https://bluepeakverity.com/sitemap.xml" \
            "https://bluepeakverity.com/robots.txt" \
            "https://bluepeakverity.com/1bccfdc0f1b230fd5f58cedc65708b5b.txt" \
            "https://www.bluepeakverity.com/"; do
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --max-time 30 --output /dev/null "${url}"
          done

      - name: Notify IndexNow of public URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY="1bccfdc0f1b230fd5f58cedc65708b5b"
          cat > indexnow-payload.json <<EOF
          {
            "host": "bluepeakverity.com",
            "key": "${KEY}",
            "keyLocation": "https://bluepeakverity.com/${KEY}.txt",
            "urlList": [
              "https://bluepeakverity.com/",
              "https://bluepeakverity.com/about.html",
              "https://bluepeakverity.com/xero-certified.html",
              "https://bluepeakverity.com/privacy.html",
              "https://bluepeakverity.com/terms.html"
            ]
          }
          EOF
          STATUS=$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)
          echo "IndexNow HTTP status: ${STATUS}"
          if [[ "${STATUS}" != "200" && "${STATUS}" != "202" ]]; then
            cat indexnow-response.txt || true
            exit 1
          fi
