name: Validate and activate elite polish

on:
  push:
    paths:
      - '.github/workflows/elite-polish-sync.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/script.js
          node --check assets/script-core.js
          node --check assets/team-upgrade.js
          node --check assets/client-experience-upgrade.js
          node --check assets/benchmark-polish.js
          node --check assets/elite-polish-v2.js
      - name: Activate fresh homepage loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/script.js?v=20260914-benchmark-r1'
          new = 'assets/script.js?v=20260914-elite-r1'
          if old not in text and new not in text:
              raise SystemExit('Expected homepage loader reference not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify activation
        run: |
          grep -q 'assets/script.js?v=20260914-elite-r1' index.html
          grep -q 'elite-polish-v2.js' assets/script.js
      - name: Commit activation
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Activate elite accounting website polish'
          git push
