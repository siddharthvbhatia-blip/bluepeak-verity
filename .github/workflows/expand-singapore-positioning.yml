name: Expand BluePeak positioning to Singapore

on:
  push:
    paths:
      - '.github/workflows/expand-singapore-positioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update market positioning across the site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Homepage: SEO, structured data and visible positioning.
          replace('index.html',
              '<title>BluePeak Verity | Outsourced Accounting Support for US & UK Firms</title>',
              '<title>BluePeak Verity | Outsourced Accounting Support for US, UK & Singapore Firms</title>')
          replace('index.html',
              'Indian Chartered Accountant-led bookkeeping, reconciliation, month-end close, cleanup, reporting, AP/AR and workpaper support for US and UK accounting firms and growing businesses.',
              'Indian Chartered Accountant-led bookkeeping, reconciliation, month-end close, cleanup, reporting, AP/AR and workpaper support for US, UK and Singapore accounting firms and growing businesses.')
          replace('index.html',
              'Precision in Numbers. Excellence in Action. Chartered Accountant-led accounting support for US and UK firms.',
              'Precision in Numbers. Excellence in Action. Chartered Accountant-led accounting support for US, UK and Singapore firms.')
          replace('index.html',
              'India-based accounting support for US and UK accounting firms and growing businesses, including bookkeeping, reconciliations, cleanup, reporting, AP/AR and workpaper preparation.',
              'India-based accounting support for US, UK and Singapore accounting firms and growing businesses, including bookkeeping, reconciliations, cleanup, reporting, AP/AR and workpaper preparation.')
          replace('index.html',
              '"areaServed":["United States","United Kingdom"]',
              '"areaServed":["United States","United Kingdom","Singapore"]')
          replace('index.html',
              'Indian CA-led · US &amp; UK accounting operations',
              'Indian CA-led · US, UK &amp; Singapore accounting operations')
          replace('index.html',
              'One control standard. <span>Three operating contexts.</span>',
              'One control standard. <span>Four operating contexts.</span>')
          replace('index.html',
              '<button type="button" class="audience-tab" role="tab" aria-selected="false" data-audience="uk">UK accountancy practices</button>\n          <button type="button" class="audience-tab" role="tab" aria-selected="false" data-audience="business">Growing businesses</button>',
              '<button type="button" class="audience-tab" role="tab" aria-selected="false" data-audience="uk">UK accountancy practices</button>\n          <button type="button" class="audience-tab" role="tab" aria-selected="false" data-audience="sg">Singapore accounting firms</button>\n          <button type="button" class="audience-tab" role="tab" aria-selected="false" data-audience="business">Growing businesses</button>')
          replace('index.html',
              'Indian Chartered Accountant providing remote accounting, bookkeeping, reconciliation, reporting and workpaper support for US, UK and global workflows.',
              'Indian Chartered Accountant providing remote accounting, bookkeeping, reconciliation, reporting and workpaper support for US, UK, Singapore and global workflows.')
          replace('index.html',
              '<summary>Is BluePeak Verity a US CPA or UK chartered-accountancy firm?</summary><p>No. BluePeak Verity is an India-based accounting-support brand led by an Indian Chartered Accountant. Jurisdiction-specific filings, attest work, regulated representation and final professional sign-off remain subject to appropriately licensed professionals where required.</p>',
              '<summary>Is BluePeak Verity a US CPA firm, UK chartered-accountancy practice or Singapore public accounting entity?</summary><p>No. BluePeak Verity is an India-based accounting-support brand led by an Indian Chartered Accountant. It provides execution and workpaper support without claiming jurisdiction-specific public-accountancy status. Filings, attest work, regulated representation and final professional sign-off remain subject to appropriately licensed professionals where required.</p>')
          replace('index.html',
              '<label><input type="radio" name="organisation" value="UK accountancy practice"><span>UK accountancy practice</span></label>\n              <label><input type="radio" name="organisation" value="Business"><span>Business</span></label>',
              '<label><input type="radio" name="organisation" value="UK accountancy practice"><span>UK accountancy practice</span></label>\n              <label><input type="radio" name="organisation" value="Singapore accounting firm"><span>Singapore accounting firm</span></label>\n              <label><input type="radio" name="organisation" value="Business"><span>Business</span></label>')
          replace('index.html',
              'Pricing excludes regulated sign-off, attest work, legal advice, tax representation, software subscriptions and third-party charges. A quote may change after sample records are reviewed.',
              'Pricing excludes regulated sign-off, attest work, legal advice, tax representation, software subscriptions and third-party charges. Singapore engagements can be quoted in S$ once scope is defined. A quote may change after sample records are reviewed.')
          replace('index.html',
              'India-based accounting support. Not represented as a US CPA firm or UK chartered-accountancy practice.',
              'India-based accounting support. Not represented as a US CPA firm, UK chartered-accountancy practice or Singapore public accounting entity.')

          # Interactive audience content.
          replace('assets/script.js',
              "    uk:{kicker:'UK accountancy practices',title:'Add Xero-oriented execution behind your practice workflow.',copy:'Bookkeeping, accounts schedules, reconciliation and VAT source-data support can follow your workpaper format and reviewer sign-off process.',proof:[['Workflow','Xero-oriented'],['Accounts','Ledgers & schedules'],['VAT support','Source-data preparation'],['Boundary','Practice retains statutory responsibility']]},\n    business:",
              "    uk:{kicker:'UK accountancy practices',title:'Add Xero-oriented execution behind your practice workflow.',copy:'Bookkeeping, accounts schedules, reconciliation and VAT source-data support can follow your workpaper format and reviewer sign-off process.',proof:[['Workflow','Xero-oriented'],['Accounts','Ledgers & schedules'],['VAT support','Source-data preparation'],['Boundary','Practice retains statutory responsibility']]},\n    sg:{kicker:'Singapore accounting firms',title:'Add disciplined execution capacity behind your Singapore practice workflow.',copy:'Bookkeeping, reconciliations, month-end schedules, GST source-data support and reviewer-ready workpapers can follow your firm’s templates and review process.',proof:[['Workflow','Xero-oriented'],['Close','Reconciliations & schedules'],['GST support','Source-data preparation'],['Boundary','No Singapore public-accountancy representation']]},\n    business:")

          # Four audience tabs on desktop.
          replace('assets/styles.css',
              '.audience-tabs{display:grid;grid-template-columns:repeat(3,1fr);',
              '.audience-tabs{display:grid;grid-template-columns:repeat(4,1fr);')

          # International delivery network: add Singapore route, node and label.
          replace('assets/graphics-upgrade.js',
              '<path class="bp-route uk" d="M198 127 C250 82 318 67 380 77"/>',
              '<path class="bp-route uk" d="M198 127 C250 82 318 67 380 77"/><path class="bp-route sg" d="M202 136 C235 150 273 166 312 164"/>')
          replace('assets/graphics-upgrade.js',
              '<g class="bp-network-node" transform="translate(380 77)"><circle r="13"/><text text-anchor="middle" dy="2.4">UK</text></g></svg>',
              '<g class="bp-network-node" transform="translate(380 77)"><circle r="13"/><text text-anchor="middle" dy="2.4">UK</text></g><g class="bp-network-node" transform="translate(312 164)"><circle r="13"/><text text-anchor="middle" dy="2.4">SG</text></g></svg>')
          replace('assets/graphics-upgrade.js',
              '<span class="bp-network-label uk"><i></i>UK practices</span><span class="bp-network-label india">',
              '<span class="bp-network-label uk"><i></i>UK practices</span><span class="bp-network-label sg"><i></i>Singapore firms</span><span class="bp-network-label india">')
          replace('assets/graphics-global.css',
              '.bp-route.uk{stroke:#21b7c8;animation-delay:-3s}',
              '.bp-route.uk{stroke:#21b7c8;animation-delay:-3s}.bp-route.sg{stroke:#547ff4;animation-delay:-5s}')
          replace('assets/graphics-global.css',
              '.bp-network-label.us{left:8%;bottom:17%}.bp-network-label.uk{right:7%;top:24%}.bp-network-label.india{right:19%;bottom:12%;background:#092b47;color:#fff;border-color:rgba(75,220,242,.22)}',
              '.bp-network-label.us{left:8%;bottom:17%}.bp-network-label.uk{right:7%;top:24%}.bp-network-label.sg{right:4%;bottom:32%}.bp-network-label.india{right:19%;bottom:12%;background:#092b47;color:#fff;border-color:rgba(75,220,242,.22)}')
          replace('assets/graphics-global.css',
              '.bp-network-label.us{left:4%}.bp-network-label.uk{right:3%}.bp-network-label.india{right:9%}',
              '.bp-network-label.us{left:4%}.bp-network-label.uk{right:3%}.bp-network-label.sg{right:1%;bottom:31%}.bp-network-label.india{right:9%}')

          # About page: make the three-market model explicit and add Singapore boundary.
          replace('about.html',
              'Meet CA Siddharth Bhatia and learn how BluePeak Verity delivers controlled accounting support for US and UK firms from India.',
              'Meet CA Siddharth Bhatia and learn how BluePeak Verity delivers controlled accounting support for US, UK and Singapore firms from India.')
          replace('about.html',
              'BluePeak Verity exists to give accounting firms and growing businesses reliable execution capacity while preserving reviewer control, documentation quality and clear responsibility.',
              'BluePeak Verity exists to give US, UK and Singapore accounting firms—and selected growing businesses—reliable execution capacity while preserving reviewer control, documentation quality and clear responsibility.')
          replace('about.html',
              'Siddharth Bhatia is an Indian Chartered Accountant providing remote accounting, bookkeeping, reconciliation, reporting and workpaper support for US, UK and global workflows.',
              'Siddharth Bhatia is an Indian Chartered Accountant providing remote accounting, bookkeeping, reconciliation, reporting and workpaper support for US, UK, Singapore and global workflows.')
          replace('about.html',
              '<li>No representation as a UK chartered-accountancy practice</li><li>No attest opinion unless lawfully provided by the appropriate professional</li>',
              '<li>No representation as a UK chartered-accountancy practice</li><li>No representation as a Singapore public accounting entity</li><li>No attest opinion unless lawfully provided by the appropriate professional</li>')
          replace('about.html',
              'India-based accounting support. Not represented as a US CPA firm or UK chartered-accountancy practice.',
              'India-based accounting support. Not represented as a US CPA firm, UK chartered-accountancy practice or Singapore public accounting entity.')

          # Credential page: connect Xero capability to the Singapore market without overstating scope.
          replace('xero-certified.html',
              "Credential details for CA Siddharth Bhatia's Xero L1 Certified Associate achievement and its relevance to BluePeak Verity's Xero-oriented accounting workflows.",
              "Credential details for CA Siddharth Bhatia's Xero L1 Certified Associate achievement and its relevance to BluePeak Verity's Xero-oriented accounting workflows, including UK and Singapore delivery contexts.")
          replace('xero-certified.html',
              "The Xero L1 Certified Associate credential supports BluePeak Verity's Xero-oriented bookkeeping and reconciliation workflows without implying a partnership, licence or authority beyond the credential's actual scope.",
              "The Xero L1 Certified Associate credential supports BluePeak Verity's Xero-oriented bookkeeping and reconciliation workflows, including UK and Singapore delivery contexts, without implying a partnership, licence or authority beyond the credential's actual scope.")

          # Terms: add the Singapore public-accountancy boundary using ACRA terminology.
          replace('terms.html',
              'BluePeak Verity is an India-based accounting-support brand led by an Indian Chartered Accountant. It is not represented as a US CPA firm or a UK chartered-accountancy firm. Jurisdiction-specific filings, attest services, regulated representation and final professional sign-off remain subject to appropriately licensed professionals where required.',
              'BluePeak Verity is an India-based accounting-support brand led by an Indian Chartered Accountant. It is not represented as a US CPA firm, a UK chartered-accountancy practice or a Singapore public accounting entity. Jurisdiction-specific filings, public accountancy services, attest services, regulated representation and final professional sign-off remain subject to appropriately licensed professionals where required.')
          replace('terms.html',
              '<strong>Effective date:</strong> 5 August 2026.',
              '<strong>Effective date:</strong> 16 August 2026.')
          replace('terms.html',
              '<span>Terms-page redesign is a presentation and usability update; substantive legal provisions have been preserved.</span>',
              '<span>India-based accounting support; jurisdiction-specific regulated work remains subject to applicable professional requirements.</span>')

          # Social sharing preview: display all three target markets.
          replace('assets/og-card.svg',
              '<title id="title">BluePeak Verity</title><desc id="desc">Precision in Numbers. Excellence in Action. International Accounting Support.</desc>',
              '<title id="title">BluePeak Verity</title><desc id="desc">Precision in Numbers. Excellence in Action. International Accounting Support for US, UK and Singapore workflows.</desc>')
          replace('assets/og-card.svg',
              '<text x="86" y="474" fill="#73dfec" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">INTERNATIONAL ACCOUNTING SUPPORT</text>',
              '<text x="86" y="474" fill="#73dfec" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">INTERNATIONAL ACCOUNTING SUPPORT</text><text x="86" y="514" fill="#9cb3c6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3">US · UK · SINGAPORE</text>')

          # Repository landing copy helps visitors who encounter GitHub in search.
          replace('README.md',
              'This public GitHub repository contains the source code used to deploy the BluePeak Verity website.',
              'This public GitHub repository contains the source code used to deploy the BluePeak Verity website. BluePeak Verity is an India-based, Chartered Accountant-led accounting-support operation serving US, UK and Singapore accounting workflows.')

          # Refresh sitemap modification dates for pages whose market copy changed.
          replace('sitemap.xml',
              '<url><loc>https://bluepeakverity.com/</loc><lastmod>2026-08-15</lastmod></url>',
              '<url><loc>https://bluepeakverity.com/</loc><lastmod>2026-08-16</lastmod></url>')
          replace('sitemap.xml',
              '<url><loc>https://bluepeakverity.com/about.html</loc><lastmod>2026-08-15</lastmod></url>',
              '<url><loc>https://bluepeakverity.com/about.html</loc><lastmod>2026-08-16</lastmod></url>')
          replace('sitemap.xml',
              '<url><loc>https://bluepeakverity.com/xero-certified.html</loc><lastmod>2026-08-15</lastmod></url>',
              '<url><loc>https://bluepeakverity.com/xero-certified.html</loc><lastmod>2026-08-16</lastmod></url>')
          replace('sitemap.xml',
              '<url><loc>https://bluepeakverity.com/terms.html</loc><lastmod>2026-08-15</lastmod></url>',
              '<url><loc>https://bluepeakverity.com/terms.html</loc><lastmod>2026-08-16</lastmod></url>')
          PY

      - name: Validate Singapore expansion
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/script.js
          node --check assets/graphics-upgrade.js
          grep -q 'US, UK & Singapore Firms' index.html
          grep -q 'data-audience="sg"' index.html
          grep -q "sg:{kicker:'Singapore accounting firms'" assets/script.js
          grep -q '>SG</text>' assets/graphics-upgrade.js
          grep -q 'Singapore public accounting entity' terms.html
          grep -q '"Singapore"' index.html
          grep -q 'US · UK · SINGAPORE' assets/og-card.svg
          ! grep -RInE --exclude-dir=.git --exclude-dir=.github '(support for US and UK|for US and UK firms|US, UK and global workflows|US &amp; UK accounting operations)' .

      - name: Commit Singapore market expansion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html xero-certified.html terms.html sitemap.xml README.md assets/script.js assets/styles.css assets/graphics-upgrade.js assets/graphics-global.css assets/og-card.svg
          git commit -m 'Add Singapore as a core BluePeak Verity target market'
          git push origin main
