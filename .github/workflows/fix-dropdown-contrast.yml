name: Fix pilot dropdown contrast

on:
  push:
    paths:
      - '.github/workflows/fix-dropdown-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Link contrast stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = '<link rel="stylesheet" href="assets/styles.css?v=20260807-definitive-1">'
          extra = '<link rel="stylesheet" href="assets/pilot-select-fix.css?v=20260816-1">'
          if extra not in s:
              if needle not in s:
                  raise SystemExit('Main stylesheet link not found')
              s = s.replace(needle, needle + '\n  ' + extra, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'assets/pilot-select-fix.css?v=20260816-1' index.html
          test -f assets/pilot-select-fix.css
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load pilot dropdown contrast fix'
          git push
