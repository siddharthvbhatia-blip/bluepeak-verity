name: Fix pilot dropdown contrast

on:
  push:
    paths:
      - '.github/workflows/fix-dropdown-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply dropdown contrast fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* BP_SELECT_CONTRAST_FIX_20260816 */'
          css = r'''

/* BP_SELECT_CONTRAST_FIX_20260816 */
.pilot-form select{
  color:#f4f8fc!important;
  background-color:#0d2238!important;
  -webkit-text-fill-color:#f4f8fc!important;
  color-scheme:dark;
}
.pilot-form select option{
  color:#f4f8fc!important;
  background:#0d2238!important;
  -webkit-text-fill-color:#f4f8fc!important;
}
.pilot-form select option:checked{
  color:#fff!important;
  background:#2b557b!important;
  -webkit-text-fill-color:#fff!important;
}
.pilot-form select option[disabled]{
  color:#9fb3c5!important;
  -webkit-text-fill-color:#9fb3c5!important;
}
'''
          if marker not in s:
              p.write_text(s + css, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'BP_SELECT_CONTRAST_FIX_20260816' assets/styles.css
          grep -q '.pilot-form select option' assets/styles.css
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/styles.css
          git commit -m 'Fix pilot form dropdown option contrast'
          git push
