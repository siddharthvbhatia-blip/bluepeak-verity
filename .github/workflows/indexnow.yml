name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Deploy BluePeak Verity to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Notify IndexNow of current public URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat 1bccfdc0f1b230fd5f58cedc65708b5b.txt | tr -d '\r\n')"
          cat > indexnow-payload.json <<EOF
          {
            "host": "bluepeakverity.com",
            "key": "${KEY}",
            "keyLocation": "https://bluepeakverity.com/${KEY}.txt",
            "urlList": [
              "https://bluepeakverity.com/",
              "https://bluepeakverity.com/about.html",
              "https://bluepeakverity.com/xero-certified.html",
              "https://bluepeakverity.com/privacy.html",
              "https://bluepeakverity.com/terms.html"
            ]
          }
          EOF
          STATUS=$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)
          echo "IndexNow HTTP status: ${STATUS}"
          if [[ "${STATUS}" != "200" && "${STATUS}" != "202" ]]; then
            cat indexnow-response.txt || true
            exit 1
          fi
