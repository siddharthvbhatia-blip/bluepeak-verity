name: Migrate BluePeak Verity

on:
  push:
    paths:
      - '.github/workflows/migrate-bluepeak.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current BluePeak Verity site from ITR Desk
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/siddharthvbhatia-blip/itrdesk.git /tmp/itrdesk
          test -f /tmp/itrdesk/bluepeak-verity/index.html
          test -f /tmp/itrdesk/bluepeak-verity/assets/styles.css
          test -f /tmp/itrdesk/bluepeak-verity/assets/script.js
          test -f /tmp/itrdesk/bluepeak-verity/assets/founder-original-attached.jpg

      - name: Copy BluePeak site to repository root
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/itrdesk/bluepeak-verity/. .
          touch .nojekyll

      - name: Convert deployment URLs for standalone repository
        run: |
          set -euo pipefail
          OLD='https://siddharthvbhatia-blip.github.io/itrdesk/bluepeak-verity/'
          NEW='https://siddharthvbhatia-blip.github.io/bluepeak-verity/'
          grep -RIl --exclude-dir=.git --exclude-dir=.github "$OLD" . | while read -r file; do
            sed -i "s|$OLD|$NEW|g" "$file"
          done
          printf 'User-agent: *\nAllow: /\nSitemap: %ssitemap.xml\n' "$NEW" > robots.txt

      - name: Validate standalone site structure
        run: |
          set -euo pipefail
          for file in index.html about.html xero-certified.html privacy.html terms.html 404.html robots.txt sitemap.xml assets/styles.css assets/script.js assets/logo.svg assets/favicon.svg assets/og-card.svg assets/founder-original-attached.jpg; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          ! grep -R "github.io/itrdesk/bluepeak-verity" --include='*.html' --include='*.xml' --include='*.txt' .

      - name: Commit standalone BluePeak Verity website
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git commit -m 'Migrate BluePeak Verity into standalone repository'
            git push origin main
          fi
