name: Normalize BluePeak custom domain URLs

on:
  push:
    paths:
      - '.github/workflows/normalize-domain-urls.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old GitHub Pages URLs with custom domain
        run: |
          set -euo pipefail
          OLD='https://siddharthvbhatia-blip.github.io/bluepeak-verity/'
          NEW='https://bluepeakverity.com/'
          grep -RIl --exclude-dir=.git --exclude-dir=.github "$OLD" . | while read -r file; do
            sed -i "s|$OLD|$NEW|g" "$file"
          done
          printf 'User-agent: *\nAllow: /\nSitemap: https://bluepeakverity.com/sitemap.xml\n' > robots.txt

      - name: Commit normalized domain URLs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No domain URL changes required.'
          else
            git commit -m 'Use bluepeakverity.com across canonical and social URLs'
            git push origin main
          fi
